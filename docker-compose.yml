version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: statcheck_dev_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: statcheck
    ports:
      - "5432:5432"
    volumes:
      - statcheck_dev_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  statcheck_dev_data:
